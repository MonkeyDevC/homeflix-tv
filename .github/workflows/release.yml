# Al subir una etiqueta vX.Y.Z: arma el .wgt y lo publica como release.
# Apps2Samsung lee los releases de este repo, así que cada etiqueta = una actualización en la TV.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: La etiqueta coincide con config.xml
        run: |
          v=$(grep -oP '<widget[^>]*\sversion="\K[^"]+' config.xml)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "config.xml dice $v pero la etiqueta es $GITHUB_REF_NAME. Sube la versión en config.xml." >&2
            exit 1
          fi

      - name: Armar .wgt
        run: node tools/build-wgt.mjs

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.wgt --title "HomeFlix $GITHUB_REF_NAME" --generate-notes
