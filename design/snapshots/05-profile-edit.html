{"label":"Editar perfil","html":"<div id=\"app\" data-route=\"profile-edit\" data-active-area=\"form\"><div id=\"profileEditScreen\" class=\"screen\" data-screen=\"profile-edit\">\n    <div class=\"form-shell\">\n      <div class=\"settings-kicker\" id=\"profileEditKicker\">PERFIL</div>\n      <h2 class=\"settings-title\" id=\"profileEditTitle\">Editar perfil</h2>\n      <div class=\"profile-edit-body\">\n        <div id=\"profileEditAvatar\" class=\"profile-avatar avatar-verde\">K<span class=\"avatar-kids\">KIDS</span></div>\n        <div id=\"profileEditForm\" class=\"form-list\"><div class=\"form-row\" data-focusable=\"true\" data-input=\"profileNameInput\" data-title=\"Nombre\" data-description=\"OK para escribir el nombre\" tabindex=\"0\"><span class=\"form-label\">Nombre</span><input id=\"profileNameInput\" type=\"text\" maxlength=\"20\" autocomplete=\"off\" value=\"Kids\" placeholder=\"Nombre del perfil\"></div><div class=\"form-row\" data-focusable=\"true\" data-adjust=\"color\" data-title=\"Color\" data-description=\"◀ ▶ para cambiar el color\" tabindex=\"0\" data-focused=\"true\"><span class=\"form-label\">Color</span><span class=\"form-choice\">◀ <span class=\"color-dot avatar-verde\"></span>Verde ▶</span></div><div class=\"form-row\" data-focusable=\"true\" data-adjust=\"kids\" data-title=\"Perfil infantil\" data-description=\"OK o ◀ ▶: un perfil infantil solo ve lo marcado #infantil\" tabindex=\"0\"><span class=\"form-label\">Perfil infantil</span><span class=\"form-choice\">◀ Sí, solo contenido #infantil ▶</span></div><div class=\"form-actions\"><div class=\"login-button\" data-focusable=\"true\" data-action=\"save\" data-title=\"Guardar\" tabindex=\"0\">Guardar</div><div class=\"login-button secondary\" data-focusable=\"true\" data-action=\"delete\" data-title=\"Borrar perfil\" data-description=\"Borra el perfil, su progreso y Mi lista\" tabindex=\"0\">Borrar perfil</div><div class=\"login-button secondary\" data-focusable=\"true\" data-action=\"cancel\" data-title=\"Cancelar\" tabindex=\"0\">Cancelar</div></div></div>\n      </div>\n      <div class=\"login-error\" id=\"profileEditError\"></div>\n    </div>\n  </div><div id=\"status\">\n    <div class=\"status-hints\" id=\"statusHints\">◀ ▶ Cambiar · OK Escribir · BACK Cancelar</div>\n    <div id=\"statusMessage\">◀ ▶ para cambiar el color</div>\n  </div></div>"}
