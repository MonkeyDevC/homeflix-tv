<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Grabadora de la intro</title>
<!-- Página de apoyo de tools/grabar-intro.mjs: corre la intro de la TV (js/intro.js, nivel «tvx») con las animaciones detenidas y las
     mueve cuadro a cuadro para capturarlas; también genera el sonido fuera de línea. No se empaqueta con la app. -->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  /* en la grabación el fundido final del contenedor no corre: lo hace la app con CSS después del clip B */
  .hfi.tvx.end { animation: none !important; }
</style>
<script src="../js/intro.js"></script>
<script>
  var A_END = 3150;   // ms: cuando termina el clip A (la marca ya está completa) y empieza el B
  window.__old = [];
  window.__new = [];

  window.__start = function () {
    HFIntro.play({ base: "../", tier: "tvx", mute: true, manual: true, video: false });
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = 0; });
    return document.getAnimations().length;
  };
  /* clip A: todo el tiempo t (ms) desde el comienzo */
  window.__seekA = function (ms) {
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = ms; });
  };
  /* clip B: se agrega «end» (acercamiento): lo nuevo parte de 0 y lo anterior sigue avanzando desde donde estaba */
  window.__beginB = function () {
    window.__old = document.getAnimations();
    document.querySelector(".hfi").classList.add("end");
    window.__new = document.getAnimations().filter(function (a) { return window.__old.indexOf(a) < 0; });
    window.__new.forEach(function (a) { a.pause(); a.currentTime = 0; });
    return window.__new.length;
  };
  window.__seekB = function (ms) {
    window.__old.forEach(function (a) { a.pause(); a.currentTime = A_END + ms; });
    window.__new.forEach(function (a) { a.pause(); a.currentTime = ms; });
  };
  window.__ready = function () {
    return new Promise(function (resolve) {
      var i = new Image();
      i.onload = function () { resolve(true); };
      i.onerror = function () { resolve(false); };
      i.src = "../images/logo.png";
    });
  };
  /* el «ta-dum» completo (no la versión liviana de la TV) renderizado fuera de línea a 48 kHz, estéreo, WAV de 16 bits → base64 */
  window.__audio = function (seconds) {
    var rate = 48000;
    var ctx = new OfflineAudioContext(2, Math.round(rate * seconds), rate);
    HFIntro._graph(ctx, 0.05, false);
    return ctx.startRendering().then(function (buf) {
      var n = buf.length;
      var ch = [buf.getChannelData(0), buf.getChannelData(1)];
      var bytes = new Uint8Array(44 + n * 4);
      var v = new DataView(bytes.buffer);
      var w = function (o, s) { for (var k = 0; k < s.length; k++) { v.setUint8(o + k, s.charCodeAt(k)); } };
      w(0, "RIFF"); v.setUint32(4, 36 + n * 4, true); w(8, "WAVE"); w(12, "fmt ");
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, rate, true);
      v.setUint32(28, rate * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 4, true);
      for (var i = 0; i < n; i++) {
        for (var c = 0; c < 2; c++) {
          var x = Math.max(-1, Math.min(1, ch[c][i]));
          v.setInt16(44 + i * 4 + c * 2, x < 0 ? x * 32768 : x * 32767, true);
        }
      }
      var s = "";
      for (var j = 0; j < bytes.length; j += 8192) { s += String.fromCharCode.apply(null, bytes.subarray(j, j + 8192)); }
      return btoa(s);
    });
  };
</script>
</head>
<body></body>
</html>
