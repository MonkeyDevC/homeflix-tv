<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>HomeFlix TV</title>
<link href="css/hf2.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
<script>
  /* Abierta desde la versión web en un computador (web/index.html → ?web=1): se maneja con mouse y teclado,
   * así que sobra la barra de ayuda del control remoto de abajo. En el televisor nunca lleva esta marca. */
  if (/[?&]web=1/.test(location.search)) { document.documentElement.setAttribute("data-web", "pc"); }
</script>
</head>
<body>
<div id="app" data-route="splash">

  <!-- Cada pantalla la dibuja js/ui/*.js con las clases del diseño aprobado (design/) -->
  <div class="screen hf2" data-screen="splash" id="scrSplash"></div>
  <div class="screen hf2" data-screen="login" id="scrLogin"></div>
  <div class="screen hf2" data-screen="profiles" id="scrProfiles"></div>
  <div class="screen hf2" data-screen="profile-edit" id="scrProfileEdit"></div>
  <div class="screen hf2" data-screen="pin" id="scrPin"></div>
  <div class="screen hf2" data-screen="accounts" id="scrAccounts"></div>
  <div class="screen hf2" data-screen="settings" id="scrSettings"></div>
  <div class="screen hf2 cat" data-screen="guide" id="scrGuide"></div>
  <div class="screen hf2 cat" data-screen="browse" id="scrBrowse"></div>
  <div class="screen hf2 cat" data-screen="detail" id="scrDetail"></div>
  <div class="screen hf2 cat" data-screen="tag-edit" id="scrTagEdit"></div>

  <!-- Buscar: el campo es fijo (no se redibuja mientras escribes) -->
  <div class="screen hf2 cat" data-screen="search" id="scrSearch">
    <div class="hf2-page" style="top:120px">
      <div class="hf2-searchbox" data-focusable="true" data-input="searchInput" data-title="Buscar" data-description="Escribe el nombre de una película o serie" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" class="hf2-search-input" type="text" autocomplete="off" spellcheck="false" placeholder="Película o serie" />
        <span class="hf2-search-hint">Usa el teclado de la TV o el del teléfono con Apps2Samsung</span>
      </div>
      <div id="searchBody"></div>
    </div>
    <div id="searchTopbar"></div>
  </div>

  <!-- Reproductor: el video y las capas de subtítulos son fijos -->
  <div class="screen hf2 pl" data-screen="player" id="scrPlayer">
    <video id="playerVideo" class="hf2-pl-videoel"></video>
    <div id="playerPoster" class="hf2-pl-poster"></div>
    <canvas id="playerSubPic" class="hf2-pl-subpic" width="1920" height="1080"></canvas>
    <div id="playerSub" class="hf2-pl-sublines live"></div>
    <div id="playerSubTop" class="hf2-pl-subtop"></div>
    <div id="playerCenter" class="hf2-pl-center" data-visible="false"></div>
    <div id="playerChrome"></div>
  </div>

  <!-- Barra de ayuda (texto de estado a la izquierda, teclas a la derecha) -->
  <div id="status" class="hf2-footer app">
    <span id="statusMessage"></span>
    <span class="keys" id="statusHints"></span>
  </div>
</div>

<script src="js/tg.bundle.js"></script>
<script src="js/config.js"></script>
<script src="js/config.local.js" onerror="void 0"></script>
<script src="js/imagenes.js" onerror="void 0"></script>
<script src="js/telegram.js"></script>
<script src="js/library.js"></script>
<script src="js/sync.js"></script>
<script src="js/art.js"></script>
<script src="js/engine/i18n-es.js"></script>
<script src="js/engine/mp4.js"></script>
<script src="js/engine/mkv.js"></script>
<script src="js/engine/subs.js"></script>
<script src="js/engine/player.js"></script>
<script src="js/playback.js"></script>
<script src="js/ui/core.js"></script>
<script src="js/ui/access.js"></script>
<script src="js/ui/library.js"></script>
<script src="js/ui/detail.js"></script>
<script src="js/ui/player.js"></script>
<script src="js/ui/app.js"></script>
<script>
  /* Versión web en computador: mouse y teclado (js/ui/web-pc.js). En la TV no se carga. */
  if (document.documentElement.getAttribute("data-web") === "pc") { document.write('<script src="js/ui/web-pc.js"><\/script>'); }
</script>
</body>
</html>
