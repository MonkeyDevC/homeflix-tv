[project]
name = "homeflix-recomendador"
version = "0.1.0"
description = "Motor de recomendaciones y búsqueda por voz de HomeFlix"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "httpx>=0.27",
  "telethon>=1.36",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracion: necesita Postgres (RECO_DB_URL)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
