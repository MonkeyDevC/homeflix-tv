services:
  homeflix:
    build: .
    container_name: homeflix
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      # Canal de actualizaciones: lo sube tools/publicar-version.mjs (scp a ~/homeflix-servidor/versiones)
      VERSIONS_DIR: /versiones
      PORT: "3000"
      # Canal «Anime»: la anime-api vive en su propio contenedor, sin puerto público; solo este servidor la alcanza.
      ANIME_URL: http://anime-api:8000
      # Recomendaciones: el motor Python (recomendador/), sin puerto público. RECO_TOKEN viene del .env.
      RECO_URL: http://reco-api:8000
    ports:
      # Solo el loopback: Caddy es la entrada pública (scalvache.shop/productos/HomeFlix).
      - "127.0.0.1:4500:3000"
    volumes:
      - homeflix-datos:/data
      - ./versiones:/versiones:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 256m
    cpus: 0.5
    networks:
      - default
      # La red privada con la consola (contenedor nexuscard): por ella llega a /interno/v1.
      - scalvache-interna
      # Red privada con el contenedor «anime-api» (servidor/anime-api/): por ella llega a ANIME_URL.
      - anime-interna
      # Red privada con el motor de recomendaciones (recomendador/): por ella llega a RECO_URL y el worker a /interno/v1/reco.
      - reco-interna

volumes:
  homeflix-datos:

networks:
  scalvache-interna:
    external: true
  anime-interna:
    external: true
  reco-interna:
    external: true
